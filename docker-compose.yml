services:

  anime_sama:
    build: .
    container_name: anime_sama
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URL: ${MONGODB_URL}
      API_BASE: https://anime.gihamos.fr
      ADMIN_PORT: "8001"
    volumes:
      - downloads:/tmp/anime_downloads
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
    name: nginx-proxy-manager_default

volumes:
  downloads: