services:

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: anime_sama
    ports:
      - "27017:27017"

  api:
    build: .
    command: python main.py
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
    depends_on:
      - mongodb
    volumes:
      - downloads:/tmp/anime_downloads

  admin:
    build: .
    command: python admin_main.py
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      API_BASE: http://api:8000
      ADMIN_PORT: "8001"
    depends_on:
      - api

volumes:
  mongo_data:
  downloads:
